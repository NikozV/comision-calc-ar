<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="dollar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  <!-- Dollar Symbol -->
  <text x="50%" y="68%" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="340" fill="url(#dollar-grad)" text-anchor="middle" dominant-baseline="central">$</text>
</svg>
